name: Update README with Blog and YouTube

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Dev.to posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: BLOG-POST-LIST
          feed_list: https://dev.to/feed/harishkotra
          max_post_count: 5

      - name: Update YouTube videos
        uses: gautamkrishnar/blog-post-workflow@v1
        continue-on-error: true
        with:
          comment_tag_name: YOUTUBE
          feed_list: https://www.youtube.com/feeds/videos.xml?channel_id=UCYdwkx72oKSkmbrMWQXLnxw
          max_post_count: 5
